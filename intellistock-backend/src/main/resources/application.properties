# Server Port
server.port=8080

# In-Memory H2 Database configuration
spring.datasource.url=jdbc:h2:mem:intellistock;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console Settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Log levels
logging.level.org.springframework.web=INFO
logging.level.com.intellistock=DEBUG

# External API Keys with Environment Variable Fallbacks
api.fmp.key=${FMP_API_KEY:}
api.finnhub.key=${FINNHUB_API_KEY:}
api.news.key=${NEWS_API_KEY:}
api.alphavantage.key=${ALPHA_VANTAGE_API_KEY:}
api.twelvedata.key=${TWELVE_DATA_API_KEY:}
api.gemini.key=${GEMINI_API_KEY:}

# Redis Cache Settings
spring.data.redis.host=localhost
spring.data.redis.port=6379



