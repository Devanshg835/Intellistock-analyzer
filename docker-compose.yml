version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: intellistock-redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: ./intellistock-backend
    container_name: intellistock-backend
    ports:
      - "8080:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - FMP_API_KEY=${FMP_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - TWELVE_DATA_API_KEY=${TWELVE_DATA_API_KEY}
      - POLYGON_API_KEY=${POLYGON_API_KEY}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - CORS_ALLOWED_ORIGINS=http://localhost:80
    depends_on:
      - redis
    restart: always

  frontend:
    build: ./intellistock-frontend
    container_name: intellistock-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
